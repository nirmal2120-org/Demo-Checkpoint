name: Polaris DAST Scan

on:
  workflow_dispatch:
  # optional automatic trigger
  # schedule:
  #   - cron: '0 2 * * *'

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    # use self-hosted if app is internal
    # runs-on: self-hosted

    steps:

      # --------------------------------------------------
      # Download Black Duck Bridge CLI
      # --------------------------------------------------
      - name: Download Bridge CLI
        run: |
          curl -fLsS -o bridge.zip \
            https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-bundle/latest/bridge-cli-bundle-linux64.zip
          unzip -q bridge.zip
          chmod +x bridge-cli-bundle-linux64/bridge-cli
    

      - name: Run Polaris DAST Scan
        env:
          POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_TOKEN }}
        run: |
          ./bridge-cli-bundle-linux64/bridge-cli \
            --stage polaris \
            polaris.serverUrl=$POLARIS_SERVER_URL \
            polaris.assessment.types=DAST \
            polaris.application.name="NIRMAL_DAST" \
            polaris.project.name="Test"
