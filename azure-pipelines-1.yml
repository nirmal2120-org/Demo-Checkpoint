trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
- group: NIRMAL_SCA

steps:
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
  displayName: 'Install Java'


- bash: |
    mvn --version
    java -version
    mvn clean install --no-transfer-progress || true
  displayName: 'Build Project'


- task: BlackDuckSecurityScan@2
  inputs:
    scanType: 'blackducksca'
    blackduckScaUrl: '$(SCAURL)'
    blackduckScaToken: '$(BD_TOKEN)'
    blackduckScaWaitForScan: false
    detectArgs: >
      --detect.project.name=Merganser
      --detect.project.version.name=main
      --detect.project.version.phase=DEVELOPMENT
